services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://sfmeter:sfmeter@db:5432/sfmeter_db?sslmode=disable
      # 書き込みの API を開けたいときだけ、.env か環境変数で ADMIN_TOKEN を渡す（空なら閉じたまま）
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    restart: on-failure

  db:
    image: postgres:16-alpine
    ports:
      # make run-local / make test-db で、手元の Go から直接つなぐため
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: sfmeter
      POSTGRES_PASSWORD: sfmeter
      POSTGRES_DB: sfmeter_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfmeter -d sfmeter_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
